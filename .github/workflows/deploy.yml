name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Reverted to v4 as v6 does not exist yet

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Crucial step: Installs node_modules

      - name: Verify chat Worker URL
        env:
          NUXT_PUBLIC_CHAT_API_URL: ${{ vars.NUXT_PUBLIC_CHAT_API_URL || secrets.NUXT_PUBLIC_CHAT_API_URL }}
        run: |
          if [ -z "$NUXT_PUBLIC_CHAT_API_URL" ]; then
            echo "::error::Set the NUXT_PUBLIC_CHAT_API_URL repository variable or secret to the deployed Cloudflare Worker URL."
            exit 1
          fi

      - run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /chesteragsamosam/
          NUXT_PUBLIC_SITE_URL: https://chesteragsamosam.github.io/chesteragsamosam
          # The Worker URL is public; accept a repository variable or the
          # original secret name so either GitHub Actions setting works.
          NUXT_PUBLIC_CHAT_API_URL: ${{ vars.NUXT_PUBLIC_CHAT_API_URL || secrets.NUXT_PUBLIC_CHAT_API_URL }}

      - uses: actions/upload-pages-artifact@v3 # Standard stable version for Pages deployment
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # Standard stable version for Pages deployment
