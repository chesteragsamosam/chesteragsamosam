name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Reverted to v4 as v6 does not exist yet

      - uses: pnpm/setup-pnpm@v4 # Updated to the standard, modern pnpm action
        with:
          dest: ~/.local/share/pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Crucial step: Installs node_modules

      - run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /chesteragsamosam/
          NUXT_PUBLIC_CHAT_API_URL: ${{ secrets.NUXT_PUBLIC_CHAT_API_URL }}

      - uses: actions/upload-pages-artifact@v3 # Standard stable version for Pages deployment
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # Standard stable version for Pages deployment
